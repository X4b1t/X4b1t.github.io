<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Парк Яг-Морт</title>
<script>
// Любой неизвестный адрес на x4b1t.github.io ведёт на сайт парка.
// /Yagmort/admin.html (заглавная буква с телефона) → /yagmort/admin.html, всё прочее → /yagmort/
(function () {
  var p = location.pathname, m = p.match(/^\/yagmort(\/.*)?$/i);
  var rest = m && m[1] ? m[1].toLowerCase() : '/';
  if (!/^\/(admin\.html|index\.html)?$/.test(rest)) rest = '/';
  location.replace('/yagmort' + rest + location.search + location.hash);
})();
</script>
<style>body{font-family:system-ui,sans-serif;background:#f4f3ee;color:#13201a;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#14923a;font-weight:700}</style>
</head>
<body>
<p>Открываем парк «Яг-Морт»…<br><a href="/yagmort/">Нажмите, если страница не открылась</a></p>
</body>
</html>
